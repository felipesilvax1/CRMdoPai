name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: crm

jobs:
  # Job 1: Testes da API de Dados
  test-api:
    name: Testes - API de Dados
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Cache dependências Python
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-api-${{ hashFiles('api/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-api-
      
      - name: Instalar dependências
        working-directory: ./api
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock
      
      - name: Executar testes
        working-directory: ./api
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: test_db
          DB_USER: postgres
          DB_PASSWORD: test_password
          USE_POSTGRES: true
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=term
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./api/coverage.xml
          flags: api
          name: api-coverage

  # Job 2: Testes do LLM Service
  test-llm:
    name: Testes - LLM Service
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Cache dependências Python
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-llm-${{ hashFiles('llm-service/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-llm-
      
      - name: Instalar dependências
        working-directory: ./llm-service
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock
      
      - name: Executar testes
        working-directory: ./llm-service
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: test_db
          DB_USER: postgres
          DB_PASSWORD: test_password
          OLLAMA_HOST: http://mock-ollama:11434
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=term
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./llm-service/coverage.xml
          flags: llm
          name: llm-coverage

  # Job 3: Testes do Frontend
  test-frontend:
    name: Testes - Frontend Next.js
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: next-app/package-lock.json
      
      - name: Instalar dependências
        working-directory: ./next-app
        run: npm ci
      
      - name: Lint
        working-directory: ./next-app
        run: npm run lint || true
      
      - name: Executar testes
        working-directory: ./next-app
        run: npm test -- --coverage
      
      - name: Build
        working-directory: ./next-app
        env:
          NEXT_PUBLIC_DEV_MODE: true
          NEXT_PUBLIC_API_URL: http://localhost:5000
          NEXT_PUBLIC_LLM_URL: http://localhost:8000
        run: npm run build
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./next-app/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage

  # Job 4: Testes de Integração
  test-integration:
    name: Testes de Integração
    runs-on: ubuntu-latest
    needs: [test-api, test-llm, test-frontend]
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build containers
        run: |
          docker-compose -f docker-compose.test.yml build
      
      - name: Executar testes de integração
        run: |
          docker-compose -f docker-compose.test.yml up -d
          sleep 30
          docker-compose -f docker-compose.test.yml exec -T api pytest tests/integration/ -v || true
          docker-compose -f docker-compose.test.yml down

  # Job 5: Build e Push das Imagens Docker
  build-and-push:
    name: Build e Push Docker Images
    runs-on: ubuntu-latest
    needs: [test-api, test-llm, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    strategy:
      matrix:
        service: [api, llm-service]
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Extrair metadados
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      
      - name: Build e Push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 6: Deploy (opcional)
  deploy:
    name: Deploy para Produção
    runs-on: ubuntu-latest
    needs: [build-and-push, test-integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Deploy notification
        run: |
          echo "🚀 Deploy iniciado para produção"
          echo "📦 Versão: ${{ github.sha }}"
      
      # Adicione aqui seus steps de deploy específicos
      # Exemplos:
      # - Deploy para Kubernetes
      # - Deploy para AWS ECS
      # - Deploy para servidor via SSH
      # - Atualizar docker-compose remoto
      
      - name: Sucesso
        run: echo "✅ Deploy concluído com sucesso!"

  # Job 7: Análise de Código
  code-quality:
    name: Análise de Qualidade
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true
      
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true


# ═══════════════════════════════════════════════════════════════
# Promtail Configuration - Coleta de Logs dos Containers
# ═══════════════════════════════════════════════════════════════

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ═══════════════════════════════════════════════════════════════
  # Logs de Containers Docker
  # ═══════════════════════════════════════════════════════════════
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["stack"]  # Filtra containers com label 'stack'
    
    relabel_configs:
      # Extrai nome do container
      - source_labels: ['__meta_docker_container_name']
        target_label: 'container_name'
        regex: '/(.*)'
      
      # Extrai ID do container
      - source_labels: ['__meta_docker_container_id']
        target_label: 'container_id'
      
      # Extrai stack do label
      - source_labels: ['__meta_docker_container_label_stack']
        target_label: 'stack'
      
      # Extrai tier do label
      - source_labels: ['__meta_docker_container_label_tier']
        target_label: 'tier'
      
      # Adiciona nome da imagem
      - source_labels: ['__meta_docker_container_label_com_docker_compose_image']
        target_label: 'image'

    # Pipeline para processar logs
    pipeline_stages:
      # Extrai timestamp
      - timestamp:
          source: time
          format: RFC3339
      
      # Extrai nível de log (INFO, ERROR, WARNING, DEBUG)
      - regex:
          expression: '(?P<level>INFO|ERROR|WARNING|DEBUG|FATAL|TRACE)'
      
      # Cria label com o nível
      - labels:
          level:
      
      # Parseia logs JSON (se aplicável)
      - json:
          expressions:
            message: message
            timestamp: timestamp
            level: level
            service: service
      
      # Métricas derivadas dos logs
      - metrics:
          error_count:
            type: Counter
            description: "Total de logs de erro"
            source: level
            config:
              value: ERROR
              action: inc

  # ═══════════════════════════════════════════════════════════════
  # Logs do Sistema (opcional)

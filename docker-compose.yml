version: '3.8'

# Incluir CRM Stack (API + LLM)
include:
  - docker-compose.crm.yml

# ═══════════════════════════════════════════════════════════════
# 📝 DOCUMENTAÇÃO RÁPIDA
# ═══════════════════════════════════════════════════════════════
#
# 🚀 COMANDOS PRINCIPAIS:
#
#   docker-compose up -d              # Iniciar CRM (padrão)
#   docker-compose logs -f            # Ver logs
#   docker-compose ps                 # Status
#   docker-compose down               # Parar CRM
#   docker-compose restart            # Reiniciar
#
# 📁 ARQUIVOS DISPONÍVEIS:
#
#   docker-compose.yml            ← Este arquivo (usa crm.yml)
#   docker-compose.crm.yml        🎯 CRM Stack (API + LLM)
#   docker-compose.frontend.yml   🌐 Frontend (produção)
#   docker-compose.all.yml        🎁 Tudo junto
#   docker-compose.test.yml       🧪 Testes
#
# 🎯 STACKS ESPECÍFICAS:
#
#   docker-compose -f docker-compose.crm.yml up -d
#   docker-compose -f docker-compose.frontend.yml up -d
#   docker-compose -f docker-compose.all.yml up -d
#
# 📊 PORTAS:
#
#   5000  - API de Dados
#   8000  - LLM Service  
#   3000  - Frontend (local: npm run dev)
#   3001  - Frontend (Docker)
#
# 🔗 PRÉ-REQUISITOS (Devem estar rodando):
#
#   • cnpj_postgres_final (PostgreSQL)
#   • ollama (LLM Engine)
#
#   Iniciar: docker start cnpj_postgres_final ollama
#
# 📖 DOCUMENTAÇÃO COMPLETA:
#
#   GERENCIAR_CONTAINERS.md
#
# ═══════════════════════════════════════════════════════════════


services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: crm-api
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=cnpj_postgres_final
      - DB_PORT=5432
      - DB_NAME=cnpj_processed
      - DB_USER=postgres
      - DB_PASSWORD=password
      - USE_POSTGRES=true
    external_links:
      - cnpj_postgres_final
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    network_mode: bridge

  next-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    depends_on:
      - api
    restart: unless-stopped

services:
  # API de Dados (PostgreSQL)
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: crm-api
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=cnpj_postgres_final
      - DB_PORT=5432
      - DB_NAME=cnpj_processed
      - DB_USER=postgres
      - DB_PASSWORD=password
      - USE_POSTGRES=true
    external_links:
      - cnpj_postgres_final
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    network_mode: bridge

  # LLM Service (LangChain + Gemma via Ollama)
  llm-service:
    build:
      context: ./llm-service
      dockerfile: Dockerfile
    container_name: crm-llm
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=cnpj_postgres_final
      - DB_PORT=5432
      - DB_NAME=cnpj_processed
      - DB_USER=postgres
      - DB_PASSWORD=password
      - OLLAMA_HOST=http://ollama:11434
    external_links:
      - cnpj_postgres_final
      - ollama
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    network_mode: bridge
    depends_on:
      - api

  # Frontend Next.js (Opcional - para produção)
  next-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm-frontend
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:5000
      - NEXT_PUBLIC_LLM_URL=http://localhost:8000
    depends_on:
      - api
      - llm-service
    restart: unless-stopped
